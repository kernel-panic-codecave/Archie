# Parallel execution is enabled but defaults to same_thread, so every existing test class stays
# sequential unless it explicitly opts in via @Execution(CONCURRENT) (see GameTests).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread

# Worker threads here spend most of their time blocked waiting on external Gradle/Minecraft
# processes rather than doing CPU work, so size the pool by a fixed count instead of core count
# (which on small CI runners could be lower than the GameTest matrix size). Each invocation test
# and each individual method test blocks its own thread until its specific result appears in the
# invocation's log (which can be minutes into a 20-minute run, since the game processes its own
# tests sequentially) - too small a pool here means most tests just queue for a thread that won't
# free up soon, never even starting even though their result may already be available. Sized well
# past worst-case demand (invocation count + every matching test method across the whole matrix)
# since these threads are cheap to over-provision.
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=128
