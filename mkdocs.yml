site_name: Archie Docs
site_description: >
    A library mod for Kernel Panic's mods
site_author: Kernel Panic
site_url: https://repo.kernelpanicsoft.net/docs/Archie/
repo_url: https://github.com/kernel-panic-codecave/Archie/
edit_uri: edit/1.21.x/docs/
use_directory_urls: false
extra:
  version:
    provider: mike
    default: latest
    alias: true
theme:
    name: material
    features:
        - content.action.edit
        - content.action.view
        - navigation.indexes
        - navigation.instant
        - navigation.instant.prefetch
        - navigation.tracking
        - navigation.tabs
        - navigation.sections
        - navigation.expand
        - navigation.path
        - navigation.prune
    icon:
        edit: material/pencil
        view: material/eye
    logo: assets/icon.svg
    favicon: assets/icon.svg
    custom_dir: docs/overrides
    palette:
        - media: "(prefers-color-scheme)"
          toggle:
              icon: material/brightness-auto
              name: "System theme (click to switch to light)"
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: green
          accent: green
          toggle:
              icon: material/brightness-7
              name: "Light theme (click to switch to dark)"
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: green
          accent: green
          toggle:
              icon: material/brightness-4
              name: "Dark theme (click to switch to system)"

nav:
  - Home: # your existing pages…
      - index.md
