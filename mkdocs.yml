site_name: Archie Docs
site_description: >
    A library mod for Kernel Panic's mods
site_author: Kernel Panic
site_url: https://docs.kernelpanicsoft.net/Archie/
repo_url: https://github.com/kernel-panic-codecave/Archie/
edit_uri: edit/1.21.x/docs/
use_directory_urls: false
theme:
    name: material
    features:
      - announce.dismiss
      - content.action.edit
      - content.action.view
      - content.code.annotate
      - content.code.copy
      - content.code.select
      - content.footnote.tooltips
      - content.tabs.link
      - content.tooltips
      # - header.autohide
      # - navigation.expand
      - navigation.footer
      - navigation.indexes
      - navigation.instant
      - navigation.instant.prefetch
      - navigation.instant.progress
      - navigation.instant.preview
      - navigation.path
      # - navigation.prune
      - navigation.sections
      - navigation.tabs
      # - navigation.tabs.sticky
      - navigation.top
      - navigation.tracking
      - search.highlight
      - search.share
      - search.suggest
      - toc.follow
      # - toc.integrate
    icon:
      edit: material/pencil
      view: material/eye
    logo: assets/icon.svg
    favicon: assets/icon.svg
    palette:
      - media: "(prefers-color-scheme)"
        toggle:
          icon: material/brightness-auto
          name: "System theme (click to switch to light)"
      - media: "(prefers-color-scheme: light)"
        scheme: slate
        primary: green
        accent: green
        toggle:
          icon: material/brightness-7
          name: "Light theme (click to switch to dark)"
      - media: "(prefers-color-scheme: dark)"
        scheme: slate
        primary: green
        accent: green
        toggle:
          icon: material/brightness-4
          name: "Dark theme (click to switch to system)"
plugins:
  - social
  - search
  - privacy
  - optimize
  - blog:
      post_excerpt: optional
      authors: false
      blog_dir: news
  - tags:
      tags_hierarchy: true
  - rss:
      match_path: 'news/posts/.*'
      date_from_meta:
        as_creation: date.created
        as_update: date.updated
      use_git: false

extra:
  version:
    provider: mike
    default: latest
    alias: true


markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home:
      - index.md
  - Guides:
      - Networking: networking.md
      - Registries: registries.md
      - Serialization: serialization.md
      - Config System: config.md
      - GUI Framework: gui.md
      - Events: events.md
      - Transfer & Inventory: transfer.md
      - Resource Packs: resource-packs.md
